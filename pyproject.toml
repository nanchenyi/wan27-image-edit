[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wan27-image-edit"
version = "0.1.0"
description = "MCP server for Tongyi Wanxiang 2.7 image editing (multi-image reference) via Aliyun Bailian (cn-beijing)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "requests>=2.31.0",
]

[project.scripts]
wan27-image-edit = "wan27_image_edit.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wan27_image_edit"]
